[project]
name = "labeler-backend"
version = "0.1.0"
description = "Image labeling backend similar to Roboflow"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.2",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.4",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.2",
    "Pillow>=10.4.0",
    "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

