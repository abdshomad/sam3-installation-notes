[project]
name = "labeler-backend"
version = "0.1.0"
description = "Image labeling backend similar to Roboflow"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.2",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.4",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.2",
    "Pillow>=10.4.0",
    "python-slugify>=8.0.4",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "einops>=0.6.0",
    "decord>=0.6.0",
    "scikit-image>=0.19.0",
    "pycocotools>=2.0.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "email-validator>=2.0.0",
    "sam3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
sam3 = { path = "../../" }

